<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — Jeu Autonome KaractiRage</title>
  <meta name="description" content="{{TITLE}} par {{AUTHOR}} — Moteur KaractiRage 2D & Logique KVL 60 FPS">
  <!-- Aucune ressource externe : le jeu doit fonctionner hors ligne (K4 / AC3).
       Les polices sont des piles système, pas des requêtes réseau. -->
  <style>
    :root {
      --bg-deep: #060913;
      --card-bg: #0D1322;
      --accent-cyan: #38BDF8;
      --accent-purple: #A855F7;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .game-shell {
      width: 100%;
      max-width: 1240px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .game-header {
      background: var(--card-bg);
      border: 1px solid #1E293B;
      border-radius: 8px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .title-group h1 {
      font-family: ui-rounded, 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-group h1 span { color: var(--accent-cyan); }
    .author-tag { font-size: 13px; color: var(--text-muted); }
    .header-badges {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .badge {
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-wasm { background: #082F49; color: var(--accent-cyan); border: 1px solid #0284C7; }
    .badge-fps { background: #064E3B; color: #A7F3D0; border: 1px solid #059669; }
    .badge-genre { background: #2E1065; color: #E9D5FF; border: 1px solid var(--accent-purple); }
    .btn-fullscreen {
      background: #1E293B;
      color: var(--text-main);
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-family: ui-rounded, 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .btn-fullscreen:hover {
      background: #334155;
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }
    .viewport-container {
      position: relative;
      background: #000;
      border: 2px solid #1E293B;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1200 / 800;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    .overlay-start {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 19, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      cursor: pointer;
      transition: opacity 0.25s ease;
    }
    .overlay-start.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .start-card {
      background: var(--card-bg);
      border: 2px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 32px 48px;
      text-align: center;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
    }
    .start-btn {
      background: #0284C7;
      color: #FFF;
      font-family: ui-rounded, 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 28px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    .game-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 4px 8px;
    }
    .controls-hint {
      display: flex;
      gap: 12px;
    }
    .key {
      background: #1E293B;
      color: #E2E8F0;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
      font-size: 11px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <header class="game-header">
      <div class="title-group">
        <h1><span>⚡</span> {{TITLE}}</h1>
        <p class="author-tag">Créé par {{AUTHOR}} • Moteur KaractiRage 2D &amp; KVL</p>
      </div>
      <div class="header-badges">
        <span class="badge badge-genre">{{GENRE}}</span>
        <span class="badge badge-wasm" id="badge-runtime">WASM • 60 FPS</span>
        <button id="btn-fullscreen" class="btn-fullscreen">⛶ PLEIN ÉCRAN</button>
      </div>
    </header>

    <div class="viewport-container" id="viewport-box">
      <canvas id="game-canvas" width="1200" height="800"></canvas>

      <div class="overlay-start" id="overlay-start">
        <div class="start-card">
          <h2 style="font-size: 24px; font-weight: 700; color: #FFF; margin-bottom: 6px;">{{TITLE}}</h2>
          <p style="color: #94A3B8; font-size: 14px;">Prêt à jouer • ZQSD / Flèches pour se déplacer</p>
          <button class="start-btn" id="start-btn">▶ LANCER LE JEU</button>
        </div>
      </div>
    </div>

    <footer class="game-footer">
      <div class="controls-hint">
        <span><span class="key">ZQSD</span> / <span class="key">Flèches</span> Déplacement</span>
        <span><span class="key">Espace</span> Action / Dialogue</span>
        <span><span class="key">1-5</span> Objets Hotbar</span>
        <span><span class="key">N</span> Radar</span>
        <span><span class="key">M</span> Muet</span>
      </div>
      <div>Autonome • KaractiRage Engine Standalone v1.0</div>
    </footer>
  </div>

  <script id="embedded-package" type="application/json">
{{EMBEDDED_JSON}}
  </script>

  <!-- Runtime embarqué : l'exportateur insère ici, juste avant la fermeture du
       body, deux balises non exécutées — la glue wasm-bindgen en
       type="text/plain" et le binaire en type="application/base64". Comme un
       script module est différé, le module ci-dessous les trouve dans le DOM
       même s'il apparaît avant elles dans le source. -->
  <script type="module">
    // -----------------------------------------------------------------------
    // Données du jeu embarquées dans le HTML (toujours présentes).
    // -----------------------------------------------------------------------
    const rawData = document.getElementById('embedded-package').textContent;
    const gamePackage = JSON.parse(rawData);
    console.log("🎮 KaractiRage Standalone:", gamePackage.metadata.title, gamePackage);

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const overlayStart = document.getElementById('overlay-start');
    const startBtn = document.getElementById('start-btn');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const viewportBox = document.getElementById('viewport-box');
    const runtimeBadge = document.getElementById('badge-runtime');

    let gameStarted = false;

    // Plein écran réactif
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        viewportBox.requestFullscreen().catch(err => console.warn(err));
      } else {
        document.exitFullscreen().catch(err => console.warn(err));
      }
    });

    // Démarrage du jeu : le runtime tourne déjà, ce bouton lève simplement
    // l'écran d'accueil pour laisser voir et piloter le canvas.
    function launchGame() {
      if (gameStarted) return;
      gameStarted = true;
      overlayStart.classList.add('hidden');
      canvas.focus();
    }

    overlayStart.addEventListener('click', launchGame);
    startBtn.addEventListener('click', launchGame);

    // -----------------------------------------------------------------------
    // État du runtime, lisible par les outils (export-smoke.mjs) :
    //   'running'      moteur embarqué démarré, frames rendues
    //   'absent'       pas de runtime dans ce fichier (export de données)
    //   'error:<msg>'  runtime présent mais démarrage impossible
    // -----------------------------------------------------------------------
    function setRuntimeState(state) {
      window.__karacti_runtime = state;
    }

    // Carte d'identification ou d'erreur : ce que contient l'export, sans
    // prétendre le jouer. Le texte est découpé pour ne pas sortir du canvas.
    function wrapLines(text, maxWidth) {
      const words = String(text).split(/\s+/).filter(Boolean);
      const lines = [];
      let current = '';
      for (const word of words) {
        const candidate = current ? current + ' ' + word : word;
        if (current && ctx.measureText(candidate).width > maxWidth) {
          lines.push(current);
          current = word;
        } else {
          current = candidate;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    function renderStaticCard(message) {
      ctx.fillStyle = "#0D1322";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#38BDF8";
      ctx.font = "bold 24px sans-serif";
      ctx.fillText(gamePackage.metadata.title, 80, 120);
      ctx.fillStyle = "#94A3B8";
      ctx.font = "16px sans-serif";
      ctx.fillText(
        "Entités : " + gamePackage.entities.length + " | Graphes KVL : " + Object.keys(gamePackage.kvl_graphs).length,
        80,
        160
      );
      ctx.fillStyle = "#F59E0B";
      ctx.font = "bold 15px sans-serif";
      let y = 210;
      for (const line of wrapLines(message, canvas.width - 160)) {
        if (y > canvas.height - 40) break;
        ctx.fillText(line, 80, y);
        y += 24;
      }
    }

    // -----------------------------------------------------------------------
    // Runtime WASM embarqué.
    //
    // Choix assumé : plus AUCUN repli `import('./pkg/engine_wasm.js')`.
    //   • en file://, un import de module voisin est bloqué (CORS) : c'était
    //     exactement la cause de la carte d'identification ;
    //   • même servi en http(s), ce repli transformerait le « fichier unique »
    //     en fichier dépendant d'un dossier pkg/ externe (donc de requêtes).
    // Désormais : soit la glue + le binaire sont embarqués dans cette page (et
    // le jeu tourne), soit on affiche une carte explicite. Zéro réseau.
    // -----------------------------------------------------------------------
    function base64ToBytes(b64) {
      const clean = String(b64).replace(/\s+/g, '');
      const binary = atob(clean);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function initRuntime() {
      const glueTag = document.getElementById('runtime-glue');
      const wasmTag = document.getElementById('runtime-wasm');

      if (!glueTag || !wasmTag) {
        setRuntimeState('absent');
        if (runtimeBadge) runtimeBadge.textContent = 'RUNTIME ABSENT';
        renderStaticCard(
          "Export de données : ce fichier ne contient pas le runtime jouable. " +
          "Le moteur n'est pas chargé depuis un fichier ouvert en file:// " +
          "(un import de ./pkg/engine_wasm.js y est bloqué par le navigateur). " +
          "Réexportez le jeu avec les artefacts wasm (dist/pkg) pour obtenir un fichier unique jouable."
        );
        return;
      }

      try {
        const glue = glueTag.textContent || '';
        const bytes = base64ToBytes(wasmTag.textContent || '');
        if (bytes.length === 0 || glue.trim().length === 0) {
          throw new Error('runtime embarqué vide ou corrompu');
        }

        // La glue est chargée depuis une Blob URL : aucun fichier voisin, donc
        // aucun CORS, même en file://.
        const blobUrl = URL.createObjectURL(new Blob([glue], { type: 'text/javascript' }));
        let wasmModule;
        try {
          wasmModule = await import(blobUrl);
        } finally {
          URL.revokeObjectURL(blobUrl);
        }

        // Instanciation synchrone à partir des octets déjà en mémoire : aucun
        // fetch de engine_wasm_bg.wasm.
        wasmModule.initSync({ module: bytes });

        if (!wasmModule.wasm_init_engine()) {
          const detail = typeof wasmModule.wasm_last_error === 'function'
            ? wasmModule.wasm_last_error()
            : '';
          throw new Error(detail || 'wasm_init_engine a renvoyé false');
        }

        const width = wasmModule.wasm_get_canvas_width();
        const height = wasmModule.wasm_get_canvas_height();
        if (!width || !height) throw new Error('dimensions de canvas invalides');
        canvas.width = width;
        canvas.height = height;

        wasmModule.wasm_import_game_package(JSON.stringify(gamePackage));

        // WebAssembly.Memory exposé par le module (--target web n'exporte pas
        // __wbindgen_memory). On relit .buffer à chaque frame : une croissance
        // du tas wasm détache les anciens ArrayBuffer.
        const memory = typeof wasmModule.wasm_memory === 'function'
          ? wasmModule.wasm_memory()
          : null;
        if (!memory) throw new Error('mémoire wasm inaccessible');

        // Recopie explicite du framebuffer wasm dans une ImageData, puis
        // putImageData : seul chemin validé par le prototype.
        const image = ctx.createImageData(width, height);
        let lastTime = performance.now();
        let premiereFrame = true;
        let framesSansFramebuffer = 0;

        function drawFrame(now) {
          const dt = Math.min((now - lastTime) / 1000.0, 0.1);
          lastTime = now;
          wasmModule.wasm_render_frame(dt);

          const ptr = wasmModule.wasm_get_framebuffer_ptr();
          if (ptr !== 0) {
            framesSansFramebuffer = 0;
            const pixels = new Uint8ClampedArray(memory.buffer, ptr, width * height * 4);
            image.data.set(pixels);
            ctx.putImageData(image, 0, 0);
            if (premiereFrame) {
              premiereFrame = false;
              setRuntimeState('running');
              if (runtimeBadge) runtimeBadge.textContent = 'WASM • MOTEUR ACTIF';
            }
          } else {
            framesSansFramebuffer++;
            if (framesSansFramebuffer === 120) {
              const message = 'le moteur a démarré mais ne produit aucun framebuffer après 120 frames';
              setRuntimeState('error:' + message);
              if (runtimeBadge) runtimeBadge.textContent = 'ERREUR RUNTIME';
              renderStaticCard('Échec du rendu : ' + message + '.');
            }
          }
          requestAnimationFrame(drawFrame);
        }
        requestAnimationFrame(drawFrame);
      } catch (erreur) {
        const message = erreur && erreur.message ? erreur.message : String(erreur);
        setRuntimeState('error:' + message);
        if (runtimeBadge) runtimeBadge.textContent = 'ERREUR RUNTIME';
        renderStaticCard("Échec du démarrage du moteur embarqué : " + message);
      }
    }

    initRuntime();
  </script>
</body>
</html>
