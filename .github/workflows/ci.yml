name: CI

# Gates minimales de la branche : moteur Rust, dictionnaire IA, Studio TypeScript,
# backend Tauri. L'audit visuel (`npm run audit:ui --strict`) reste une gate LOCALE :
# son rendu de polices dépend de la plateforme et ferait échouer la CI pour rien.

on:
  push:
    branches:
      - main
      - feat/tauri-react-studio
      - feat/ux-consolidation
  pull_request:
    branches:
      - main
      - feat/tauri-react-studio

# Un nouveau push sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  moteur:
    name: Moteur Rust (engine, KVL, wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Installer la toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      # `tinyaudio` tire `alsa-sys` sur Linux : invisible depuis macOS, fatal ici.
      - name: Dépendances système (audio Linux)
        timeout-minutes: 8
        run: |
          # Un incident DNS du runner (Temporary failure resolving …) a déjà bloqué
          # cette étape 15 minutes : délais courts + retries, et échec rapide.
          # Chemin rapide : l'image du runner fournit souvent déjà ces paquets.
          # On ne touche au réseau que s'il en manque un.
          manquants=""
          for p in libasound2-dev pkg-config; do
            dpkg -s "$p" >/dev/null 2>&1 || manquants="$manquants $p"
          done
          if [ -n "$manquants" ]; then
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
            sudo apt-get update $APT_OPTS
            sudo apt-get install -y --no-install-recommends $APT_OPTS $manquants
          else
            echo "Dépendances audio déjà présentes — aucun accès réseau."
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo check
        run: cargo check --all-targets -p engine-core -p kvl-core -p kvl-runtime -p kvl-cli -p engine-wasm

      - name: cargo test
        run: cargo test -p engine-core -p kvl-core -p kvl-runtime -p kvl-cli

      - name: Non-dérive du dictionnaire IA (dist/ai)
        run: bash scripts/ci_ai_dictionary.sh

  studio:
    name: Studio TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Installer
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Lint (oxlint)
        run: npm run lint

      - name: Versions alignées (Cargo / package.json / Tauri)
        run: npm run check:versions

  tauri:
    name: Backend Tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (prérequis Tauri v2, Linux)
        timeout-minutes: 12
        run: |
          PAQUETS="libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev pkg-config file"
          manquants=""
          for p in $PAQUETS; do
            dpkg -s "$p" >/dev/null 2>&1 || manquants="$manquants $p"
          done
          if [ -n "$manquants" ]; then
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
            sudo apt-get update $APT_OPTS
            sudo apt-get install -y --no-install-recommends $APT_OPTS $manquants
          else
            echo "Prérequis Tauri déjà présents — aucun accès réseau."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      # `tauri-build` lit `apps/studio/dist` : le frontend doit exister avant cargo check.
      - name: Construire le frontend
        working-directory: apps/studio
        run: |
          npm ci
          npm run build

      - name: Installer la toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: cargo check (backend Tauri)
        run: cargo check -p karactirage-studio
