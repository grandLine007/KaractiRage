[workspace]
resolver = "2"
members = [
    "crates/kvl-core",
    "crates/kvl-runtime",
    "crates/kvl-cli",
    "crates/engine-core",
    "apps/studio/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["KaractiRage Team"]
license = "MIT OR Apache-2.0"

# ---------------------------------------------------------------------------
# Profils de compilation : le Studio est lancé via `cargo tauri dev` (debug),
# donc on optimise les dépendances et le code applicatif pour garder 60 FPS
# constant même en mode développement.
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde", "js"] }
tracing = "0.1"
tracing-subscriber = "0.3"
winit = "0.29"
softbuffer = "0.4"

