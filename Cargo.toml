[workspace]
resolver = "2"
# Les crates vendorés ne sont pas des membres : sans cela, cargo les inclut
# automatiquement (dépendances `path`) et lance leurs doctests/exemples amont,
# qui référencent des assets absents du vendoring.
exclude = ["vendor/tiled-0.16.0", "vendor/quick-xml-0.31.0"]
members = [
    "crates/kvl-core",
    "crates/kvl-runtime",
    "crates/kvl-cli",
    "crates/engine-core",
    "crates/engine-wasm",
    "apps/studio/src-tauri",
]

[workspace.package]
version = "0.4.5"
edition = "2021"
authors = ["KaractiRage Team"]
license = "MIT OR Apache-2.0"

# ---------------------------------------------------------------------------
# Profils de compilation : le Studio est lancé via `cargo tauri dev` (debug),
# donc on optimise les dépendances et le code applicatif pour garder 60 FPS
# constant même en mode développement.
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde", "js"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tiled = { path = "vendor/tiled-0.16.0", default-features = false }
winit = "0.29"
softbuffer = "0.4"

# ---------------------------------------------------------------------------
# Vendoring local (P2.2) : crates.io est inaccessible (index/API bloqués) mais
# les archives restent téléchargeables. Ces deux crates sont donc fournis en
# source pour que `tiled` compile hors ligne.
# ---------------------------------------------------------------------------
[patch.crates-io]
quick-xml = { path = "vendor/quick-xml-0.31.0" }
